<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>已封存：14 個技能書技能的第一版總覽</title>
<style>
:root{
  --ground:#F2EEE6; --card:#FFFDF8; --line:#DCD2C0; --line-soft:#EAE3D5;
  --ink:#1E1A16; --ink-soft:#6B6154;
  --gold:#8A6A22; --ember:#A8412A;
  --note-bg:#F6EEDC; --note-line:#C9A94E;
  --warn-bg:#F7E7E2; --warn-line:#A8412A;
  --live-bg:#E3F5E9; --live-line:#1F7A44;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#100D0B; --card:#1A1613; --line:#332A22; --line-soft:#241E19;
  --ink:#EDE6DA; --ink-soft:#9B9081;
  --gold:#D9AE55; --ember:#E0765A;
  --note-bg:#241C10; --note-line:#8A6A22;
  --warn-bg:#2A1713; --warn-line:#A8412A;
  --live-bg:#1F4A2E; --live-line:#7FE0A0;
}}
:root[data-theme="dark"]{
  --ground:#100D0B; --card:#1A1613; --line:#332A22; --line-soft:#241E19;
  --ink:#EDE6DA; --ink-soft:#9B9081;
  --gold:#D9AE55; --ember:#E0765A;
  --note-bg:#241C10; --note-line:#8A6A22;
  --warn-bg:#2A1713; --warn-line:#A8412A;
  --live-bg:#1F4A2E; --live-line:#7FE0A0;
}
*{box-sizing:border-box}
body{
  margin:0; padding:26px 16px 72px;
  background:var(--ground); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  line-height:1.75; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin:0}
h1{font-size:27px;margin:8px 0 0;letter-spacing:-.01em;text-wrap:balance}
.lede{margin:10px 0 0;color:var(--ink-soft);font-size:14.5px}
.note{background:var(--note-bg);border-left:3px solid var(--note-line);
  border-radius:0 10px 10px 0;padding:14px 16px;margin:22px 0;font-size:14.5px}
.note.warn{background:var(--warn-bg);border-left-color:var(--warn-line)}
.note p{margin:0 0 8px}.note p:last-child{margin:0}
h2{font-size:20px;margin:38px 0 6px;padding-top:14px;border-top:2px solid var(--gold);
  display:flex;align-items:baseline;gap:10px}
.num{display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--card);
  font-size:14px;font-weight:700;flex:none}
h3{font-size:16px;margin:24px 0 6px;color:var(--gold)}
.unit-sub{color:var(--ink-soft);font-size:13.5px;margin:-2px 0 0}
figure{margin:0;background:var(--card);border:1px solid var(--line);
  border-radius:14px;overflow:hidden}
figure img{display:block;width:100%;height:auto;background:
  repeating-conic-gradient(#00000012 0% 25%, transparent 0% 50%) 50%/16px 16px}
figcaption{padding:10px 14px 12px;font-size:13px;color:var(--ink-soft);
  border-top:1px solid var(--line-soft);text-align:center}
figcaption b{color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media (max-width:640px){.grid3{grid-template-columns:1fr 1fr}}
.scroll{overflow-x:auto;margin:16px 0}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:440px;
  background:var(--card);border:1px solid var(--line);border-radius:10px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line-soft)}
th{color:var(--gold);font-size:12.5px;letter-spacing:.05em;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num2{text-align:right;font-variant-numeric:tabular-nums}
p{font-size:15px;margin:0 0 12px}
ul{padding-left:22px;margin:0 0 14px}li{margin:5px 0;font-size:15px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
  background:var(--card);border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;color:var(--ember)}
a{color:var(--gold)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
  color:var(--ink-soft);background:var(--card)}
.redo{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;
  padding:14px 16px;margin:14px 0 0}
.redo b{color:var(--ember)}
.rowlabel{font-size:13px;font-weight:700;color:var(--ink-soft);margin:16px 0 0;
  display:flex;align-items:center;gap:8px}
.rowlabel.isnew{color:var(--gold)}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700;letter-spacing:.03em}
.tag.old{background:var(--warn-bg);color:var(--ember)}
.tag.new{background:var(--note-bg);color:var(--gold)}
.tag.live{background:var(--live-bg);color:var(--live-line)}
footer{margin-top:44px;color:var(--ink-soft);font-size:13px;text-align:center}
tr.cap td{opacity:.55}
</style><style>
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;min-width:440px}
table th,table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.10);text-align:left;vertical-align:top}
table th{font-weight:600;opacity:.72;border-bottom:1px solid rgba(255,255,255,.22)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.small{font-size:13px;opacity:.75;line-height:1.7}
code{font-size:.9em;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.08);word-break:break-all}
h3{font-size:17px;margin:26px 0 10px;font-weight:600}
pre.copy{background:rgba(255,255,255,.05);padding:14px 16px;border-radius:8px;overflow-x:auto;
  font-size:13px;line-height:1.85;white-space:pre-wrap;word-break:break-word;
  font-family:inherit;border:1px solid rgba(255,255,255,.10)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0}
.grid2 figure{margin:0}
.grid2 img{width:100%;border-radius:8px;display:block}
.pick{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;
  background:rgba(120,200,140,.18);color:#8fd8a2;margin-left:6px;vertical-align:middle}
body{padding-bottom:72px}
</style>

</head>
